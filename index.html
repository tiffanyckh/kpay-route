<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>外勤路線規劃</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📍%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">外勤路線規劃</div>
  <div class="top-stats" id="topStats"></div>
</header>

<div id="banner" class="banner hidden"></div>

<main>
  <!-- 匯入 / 設定 -->
  <section id="view-setup" class="view">
    <div class="card">
      <h2>1. 上載每週路線 Excel</h2>
      <p class="muted">可以上載多份，相同 MID 會自動合併，之前嘅結果會保留。資料只會存喺呢部機。</p>
      <label class="btn primary file-btn">揀 Excel 檔案
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" multiple hidden>
      </label>
      <div id="importLog" class="muted small"></div>
    </div>

    <div class="card">
      <h2>2. 查地圖位置</h2>
      <p class="muted" id="lookupInfo"></p>
      <div class="progress hidden" id="lookupProgress"><div class="bar" id="lookupBar"></div><span id="lookupText"></span></div>
      <div class="row gap">
        <button class="btn primary" id="btnLookup">開始查</button>
        <button class="btn" id="btnLookupRetry">重查搵唔到嘅</button>
      </div>
    </div>

    <div class="card">
      <h2>3. 排日子</h2>
      <div class="grid2">
        <label>分幾多日
          <input type="number" id="numDays" min="1" max="14" value="1">
        </label>
        <label>由邊日開始
          <input type="date" id="startDate">
        </label>
        <label>交通
          <select id="mode">
            <option value="walk">行路</option>
            <option value="transit">行路 + 港鐵/巴士</option>
          </select>
        </label>
        <label>每間停留（分鐘）
          <input type="number" id="dwell" min="1" max="120" value="5">
        </label>
      </div>
      <label class="check"><input type="checkbox" id="balance" checked> 每日平均分配間數</label>
      <div id="dayRows"></div>
      <button class="btn primary big" id="btnPlan">AI 排路線</button>
      <p class="muted small">排法：先避開未開門／已收工嘅鋪，就快收嘅鋪先去，再揀最近嘅下一間，最後調整次序減少走回頭路。</p>
    </div>
  </section>

  <!-- 地圖 -->
  <section id="view-map" class="view hidden">
    <div class="map-tools">
      <select id="mapDay"></select>
      <label class="check small"><input type="checkbox" id="mapShowAll" checked> 顯示全部鋪</label>
    </div>
    <div id="map"></div>
    <div class="legend small">
      <span><i class="dot pending"></i>未去</span>
      <span><i class="dot success"></i>成功</span>
      <span><i class="dot retry"></i>冇開·再去</span>
      <span><i class="dot fail"></i>不成功</span>
    </div>
  </section>

  <!-- 路線 -->
  <section id="view-route" class="view hidden">
    <div class="day-tabs" id="dayTabs"></div>
    <div id="routeHead" class="route-head"></div>
    <div id="routeList"></div>
  </section>

  <!-- 總覽 -->
  <section id="view-summary" class="view hidden">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="row between wrap gap">
        <h2>全部鋪</h2>
        <div class="row gap wrap">
          <button class="btn" id="btnExport">匯出 Excel</button>
          <button class="btn danger-outline" id="btnDeleteDone">刪除已完成</button>
          <button class="btn danger" id="btnDeleteAll">清除全部</button>
        </div>
      </div>
      <div class="row gap wrap filters">
        <input type="search" id="sumSearch" placeholder="搵 MID／舖名／地址">
        <select id="sumFilter">
          <option value="all">全部</option>
          <option value="pending">未去</option>
          <option value="retry">冇開·再去</option>
          <option value="success">成功</option>
          <option value="fail">不成功</option>
          <option value="nogeo">地圖搵唔到</option>
        </select>
      </div>
      <div id="sumList"></div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="setup" class="active"><span>⚙︎</span>設定</button>
  <button data-view="map"><span>🗺</span>地圖</button>
  <button data-view="route"><span>📍</span>路線</button>
  <button data-view="summary"><span>📊</span>總覽</button>
</nav>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
